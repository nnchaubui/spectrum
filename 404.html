<body class="bg-main">

			.error-page, .error-page .home-hero-vibrant {
				height: 100vh;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0;
				overflow: hidden;
				background: #000 !important;
				position: relative;
			}
			.error-page .hero-content {
				padding-bottom: 0;
				z-index: 10;
			}
			/* CSS Pure Animation Blobs */
			.css-blobs {
				position: absolute;
				top: 0; left: 0; width: 100%; height: 100%;
				filter: blur(80px);
				opacity: 0.6;
				z-index: 1;
			}
			.blob {
				position: absolute;
				width: 45vw;
				height: 45vw;
				border-radius: 50%;
			}
			.blob-1 { background: #ffffff; top: -15%; left: -10%; opacity: 0.15; }
			.blob-2 { background: #666666; bottom: -10%; right: -5%; opacity: 0.1; }
			.blob-3 { background: #333333; top: 30%; left: 20%; opacity: 0.05; }
		</style>

				</div>
